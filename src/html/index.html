<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Access-Control-Allow-Origin" content="*" />
    <title>Startsida</title>

    <link rel="stylesheet" href="../css/main.scss">
    <script src="../js/main.js" type="module" defer></script> 
</head>
</head>
<body>

    <header>
        <nav>
            <ul>
                <li class="current-page">Startsida</li>
                <li><a href="profile.html">Min profil</a></li>
            </ul>
        </nav>
    </header>

    <h1>Valfakta är bra fakta</h1>

    <main>
        
        <div class="flexbox">
            <p>
                Visste du att blåvalen kan bli upp till 30 meter lång och väga mellan 150 poch 200 ton?
            </p>

            <p>Logga in på din profil för att läsa mer!</p>

            <img src="../images/whale.png">
        </div>
        
        
        <div class="sign-in">
            <h2>Logga in</h2>
            <form id="sign-in-form">
                <!--användarnamn-->
                <div>
                    <label for="username">Användarnamn:</label>
                    <br>
                    <input type="text" id="signinUsername" name="username">
                </div>

                <!--lösenord-->
                <div>
                    <label for="password">Lösenord:</label>
                    <br>
                    <input type="text" id="signinPassword" name="password">
                </div>

                <p id="wrongSignIn"></p>
                <p id="noAllSignIn"></p>

                <!--logga in-knapp-->
                <div>
                    <input id="sign-in-button" type="submit" value="Logga in">
                </div>
            </form>
        </div>

        <div class="sign-in">
            <h2>Skapa konto</h2>
            <form id="sign-up-form">
                <!--användarnamn-->
                <div>
                    <label for="username">Användarnamn:</label>
                    <br>
                    <input type="text" id="signupUsername" name="username">
                </div>

                <!--lösenord-->
                <div>
                    <label for="password">Lösenord:</label>
                    <br>
                    <input type="text" id="signupPassword" name="password">
                </div>

                <!--förnamn-->
                <div>
                    <label for="firstName">Förnamn:</label>
                    <br>
                    <input type="text" id="firstName" name="firstName">
                </div>

                <!--efternamn-->
                <div>
                    <label for="lastName">Efternamn:</label>
                    <br>
                    <input type="text" id="lastName" name="lastName">
                </div>

                <!--email-->
                <div>
                    <label for="email">E-post:</label>
                    <br>
                    <input type="text" id="email" name="email">
                </div>

                <!--skapa konto-knapp-->
                <div>
                    <input id="sign-up-button" type="submit" value="Skapa konto">
                </div>

                <p id="signupError"></p>
                <p id="signupPasswordError"></p>
            </form>
        </div>

    </main>

    <script>
        

        
    </script>
</body>
</html>
