<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Access-Control-Allow-Origin" content="*" />
    <title>Startsida</title>

    <link rel="stylesheet" href="../css/main.scss">
    <!-- <script src="../js/main.js" type="module"></script> -->
</head>
</head>
<body>

    <header>
        <nav>
            <ul>
                <li class="current-page">Startsida</li>
                <li><a href="profile.html">Min profil</a></li>
            </ul>
        </nav>
    </header>

    <h1>Valfakta är bra fakta</h1>

    <main>
        
        <div class="flexbox">
            <p>
                Visste du att blåvalen kan bli upp till 30 meter lång och väga mellan 150 poch 200 ton?
            </p>

            <p>Logga in på din profil för att läsa mer!</p>

            <img src="../images/whale.png">
        </div>
        
        
        <div class="sign-in">
            <h2>Logga in</h2>
            <form action="/signin">
                <!--användarnamn-->
                <div>
                    <label for="username">Användarnamn:</label>
                    <br>
                    <input type="text" id="username" name="username">
                </div>

                <!--lösenord-->
                <div>
                    <label for="password">Lösenord:</label>
                    <br>
                    <input type="text" id="password" name="password">
                </div>

                <!--logga in-knapp-->
                <div>
                    <input class="sign-in" type="submit">
                </div>
            </form>
        </div>

        <div class="sign-in">
            <h2>Skapa konto</h2>
            <form>
                <!--användarnamn-->
                <div>
                    <label for="username">Användarnamn:</label>
                    <br>
                    <input type="text" id="username" name="username">
                </div>

                <!--lösenord-->
                <div>
                    <label for="password">Lösenord:</label>
                    <br>
                    <input type="text" id="password" name="password">
                </div>

                <!--förnamn-->
                <div>
                    <label for="firstName">Förnamn:</label>
                    <br>
                    <input type="text" id="firstName" name="firstName">
                </div>

                <!--efternamn-->
                <div>
                    <label for="lastName">Efternamn:</label>
                    <br>
                    <input type="text" id="lastName" name="lastName">
                </div>

                <!--email-->
                <div>
                    <label for="email">E-post:</label>
                    <br>
                    <input type="text" id="email" name="email">
                </div>

                <!--skapa konto-knapp-->
                <div>
                    <input class="sign-up" type="submit">
                </div>
            </form>
        </div>

    </main>

    <footer>
        <p>Amanda Thim - amth2302</p>
        <p>Moment 4 - Autentisering och säkerhet</p>
    </footer>
</body>
</html>
